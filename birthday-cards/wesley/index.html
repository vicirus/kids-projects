<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Happy Birthday Wesley! — from Miles</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Gochi+Hand&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:#8a8578 radial-gradient(#9b968a 1px,transparent 1.5px) 0 0/7px 7px;
    font-family:"Patrick Hand",system-ui,sans-serif;color:#2b2b2b;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  .book{
    --w:min(92vw, calc((100vh - 110px) * .667));
    width:var(--w);height:calc(var(--w) * 1.5);
    position:relative;perspective:2200px;
  }
  .page{
    position:absolute;inset:0;background:#fdfdf8;border-radius:6px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    transform-origin:left center;transition:transform 1.1s cubic-bezier(.6,.05,.3,1);
    backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;
  }
  .page.flipped{transform:rotateY(-178deg);pointer-events:none}
  .page svg{width:100%;height:100%;display:block}
  .page svg.gift2,.page svg.bow{height:auto}
  .page .sticker svg{height:auto;width:92%}
  .nav{display:flex;gap:18px;align-items:center}
  .btn{
    width:64px;height:64px;border-radius:50%;border:4px solid #2b2b2b;background:#ffd84d;
    font-size:34px;line-height:1;cursor:pointer;box-shadow:0 4px 0 #2b2b2b;
    display:grid;place-items:center;color:#2b2b2b;font-family:inherit;
    animation:nudge 1.6s ease-in-out infinite;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2b2b2b}
  .btn[disabled]{opacity:.25;animation:none;cursor:default}
  .btn.back{background:#9fd8ff;animation:none;width:52px;height:52px;font-size:26px}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
  .dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:#ffffff66}.dots i.on{background:#fff}

  /* page 1 */
  .letter{animation:bob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-3deg)}}
  .rays{animation:spin 18s linear infinite;transform-origin:400px 0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .cloudA{animation:drift 14s ease-in-out infinite alternate}
  .cloudB{animation:drift 11s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
  .tree{animation:sway 4s ease-in-out infinite;transform-origin:330px 545px}
  @keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
  .bird{animation:fly 9s linear infinite}
  @keyframes fly{from{transform:translate(-60px,0)}to{transform:translate(470px,-30px)}}
  .flap{animation:flap .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  @keyframes flap{to{transform:scaleY(-.6)}}
  .balloon{cursor:pointer}
  .hint{font-family:"Gochi Hand";font-size:15px;fill:#33508a;opacity:.85}

  /* page 2 */
  .msg{position:absolute;inset:0;padding:9% 9% 0;font-family:"Gochi Hand",cursive;font-size:calc(var(--w,400px) * .074);line-height:1.2}
  .msg span{display:block;opacity:0;transform:translateY(8px) rotate(-1deg)}
  .show .msg span{animation:write .7s ease-out forwards}
  @keyframes write{to{opacity:1;transform:none}}
  .msg .hi{font-size:1.08em;color:#c0392b}
  .rule{position:absolute;left:0;right:6%;top:76%;border-top:3px solid #333;transform:rotate(-1.2deg)}
  .page svg.gift2{position:absolute;left:50%;bottom:4%;width:20%;transform:translateX(-50%);animation:hop 1.4s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateX(-50%) translateY(0)}40%{transform:translateX(-50%) translateY(-12px) rotate(-6deg)}60%{transform:translateX(-50%) translateY(-12px) rotate(6deg)}}
  .edge{position:absolute;top:0;bottom:0;right:4%;border-right:3px solid #333}

  /* page 3 */
  #robot{transition:transform .9s cubic-bezier(.3,1.7,.45,1)}
  #robotInner{transform-box:view-box;transform-origin:240px 340px}
  .popped #robotInner{animation:boing 1.6s ease-in-out .9s infinite}
  @keyframes boing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scaleY(.97)}}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 3.5s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .antenna{animation:beacon .8s steps(2) infinite}
  @keyframes beacon{50%{fill:#ffe14d}}
  .talking .grille{animation:talk .18s steps(2) infinite}
  @keyframes talk{50%{fill:#6ff0ff}}
  #lid3{cursor:grab;touch-action:none;transform-box:view-box;transform-origin:240px 320px}
  #lid3.gone{transition:transform .8s cubic-bezier(.3,.6,.4,1),opacity .8s;transform:translate(170px,-300px) rotate(60deg);opacity:0;pointer-events:none}
  #bubble{transform-box:view-box;transform-origin:235px 145px;transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
  .popped #bubble{transform:scale(1)}
  .rtext{font-family:"Orbitron","Courier New",monospace;font-weight:700;font-size:20px;fill:#1d3f8f}
  .hint3{font-family:"Gochi Hand";font-size:20px;fill:#c0392b}
  .popped .hint3{display:none}
  .popped.done .hint3,.popped.waitball .hint3{display:inline}
  #robotBall,#ball3{cursor:pointer}
  .waitball #robotBall,.waitball #ball3{filter:drop-shadow(0 0 8px #ffd84d)}
  .done #bubble{transform:scale(0)}
  .still #robotInner{animation:none!important}
  @keyframes pulse{50%{transform:scale(1.08)}}
  #wesArms path,#wesMouth{transition:d .4s}
  #wes{transform-box:view-box;transform-origin:89px 555px}
  #wes:not(.jump){animation:silly 2.4s ease-in-out infinite}
  @keyframes silly{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  #wes.jump{animation:jump .5s ease-in-out infinite}
  @keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px) rotate(3deg)}}
  canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:50}
</style>
</head>
<body>
<canvas class="fx" id="fx"></canvas>

<div class="book" id="book">

  <!-- PAGE 3 (bottom of stack): the giant present + pop-up robot -->
  <div class="page" id="p3">
    <svg id="p3svg" viewBox="0 0 400 600">
      <defs>
        <filter id="crayon3"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
        <clipPath id="ballClip"><circle cx="240" cy="262" r="28"/></clipPath>
        <g id="ballArt">
        <g clip-path="url(#ballClip)">
          <rect x="210" y="232" width="60" height="9" fill="#e8413c"/><rect x="210" y="241" width="60" height="8" fill="#f68b28"/>
          <rect x="210" y="249" width="60" height="8" fill="#f7d333"/><rect x="210" y="257" width="60" height="9" fill="#4cbf4a"/>
          <rect x="210" y="266" width="60" height="8" fill="#2f8be0"/><rect x="210" y="274" width="60" height="8" fill="#5a46b8"/>
          <rect x="210" y="282" width="60" height="10" fill="#b04ac0"/>
          <path d="M240 232v60M212 262h56M222 238c9 10 9 38 0 48M258 238c-9 10-9 38 0 48" fill="none" stroke="#222" stroke-width="2.5"/>
        </g>
        <circle cx="240" cy="262" r="28" fill="none" stroke="#222" stroke-width="3"/>
        </g>
      </defs>
      <line x1="0" y1="0" x2="0" y2="600" stroke="#333" stroke-width="5"/>
      <!-- floor -->
      <rect x="0" y="555" width="400" height="45" fill="#f1e3c6"/>
      <path d="M0 555h400" stroke="#333" stroke-width="2.5"/>
      <path d="M60 568h60M300 566h70" stroke="#d8c39a" stroke-width="3"/>

      <!-- inside of the box (dark opening) -->
      <rect x="152" y="328" width="176" height="12" fill="#4f8a2e" stroke="#333" stroke-width="2"/>

      <!-- ROBOT (hidden inside the box until the lid comes off) -->
      <g id="robot" style="transform:translateY(215px)">
       <g id="robotInner">
        <path d="M240 342l-16-5 32-6-32-6 32-6-32-6 32-6-16-5" fill="none" stroke="#777" stroke-width="5" stroke-linejoin="round"/>
        <g stroke="#333" stroke-width="2.5" stroke-linejoin="round">
          <path d="M240 158v-12" stroke-width="3"/>
          <circle class="antenna" cx="240" cy="140" r="7" fill="#e8413c"/>
          <rect x="198" y="174" width="8" height="16" rx="2" fill="#7d8aa3"/>
          <rect x="274" y="174" width="8" height="16" rx="2" fill="#7d8aa3"/>
          <rect x="205" y="158" width="70" height="50" rx="9" fill="#b8c4d6"/>
          <g class="eyes"><circle cx="223" cy="179" r="9" fill="#fff"/><circle cx="257" cy="179" r="9" fill="#fff"/>
            <circle cx="224" cy="180" r="4" fill="#2f8be0" stroke="none"/><circle cx="258" cy="180" r="4" fill="#2f8be0" stroke="none"/></g>
          <rect class="grille" x="222" y="194" width="36" height="8" rx="2" fill="#555"/>
          <rect x="232" y="208" width="16" height="9" fill="#7d8aa3"/>
          <rect x="195" y="216" width="90" height="80" rx="9" fill="#9aa8bf"/>
          <circle cx="212" cy="230" r="4" fill="#4cbf4a"/><circle cx="268" cy="230" r="4" fill="#f7d333"/>
          <path d="M195 232L176 258L210 268M285 232L304 258L270 268" fill="none" stroke="#7d8aa3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <use id="robotBall" href="#ballArt"/>
        <circle cx="210" cy="268" r="6" fill="#7d8aa3" stroke="#333" stroke-width="2"/>
        <circle cx="270" cy="268" r="6" fill="#7d8aa3" stroke="#333" stroke-width="2"/>
       </g>
      </g>

      <!-- box front -->
      <g id="boxFront" filter="url(#crayon3)" stroke="#333" stroke-width="2.5">
        <rect x="150" y="336" width="180" height="219" fill="#8fd15a"/>
        <g stroke="#6fbf3a" stroke-width="3" opacity=".6"><path d="M160 360h50M162 380h45M165 480v60M190 470v70M290 360v50M310 365v50M285 480v65M305 475v70"/></g>
        <rect x="225" y="336" width="30" height="219" fill="#e8742c"/>
        <rect x="150" y="428" width="180" height="28" fill="#e8742c"/>
      </g>

      <use id="ball3" href="#ballArt" style="display:none"/>

      <!-- lid (pull it off!) -->
      <g id="lid3">
        <rect x="140" y="306" width="200" height="32" fill="#8fd15a" stroke="#333" stroke-width="2.5"/>
        <rect x="225" y="306" width="30" height="32" fill="#e8742c" stroke="#333" stroke-width="2"/>
        <path d="M238 306c-50-55-90-20-40 0M242 306c50-55 90-20 40 0" fill="#8fd15a" stroke="#4a8a2a" stroke-width="5"/>
        <rect x="120" y="230" width="240" height="120" fill="transparent"/>
      </g>

      <!-- Wesley, as tall as the present -->
      <g id="wes" stroke="#333" stroke-width="2.2" stroke-linejoin="round">
        <path d="M78 478l-4 70M100 478l4 70" stroke="#2d3e66" stroke-width="10" stroke-linecap="round"/>
        <ellipse cx="72" cy="551" rx="13" ry="7" fill="#e8413c"/><ellipse cx="106" cy="551" rx="13" ry="7" fill="#e8413c"/>
        <g id="wesArms" fill="none" stroke="#c98a5a" stroke-width="8" stroke-linecap="round">
          <path id="wesArmL" d="M68 402L52 455"/>
          <path id="wesArmR" d="M108 402L142 336"/>
        </g>
        <path d="M66 394h46l6 88H60z" fill="#2f8be0"/>
        <text x="89" y="452" text-anchor="middle" font-family="Patrick Hand" font-size="34" fill="#fff" stroke="none">7</text>
        <circle cx="89" cy="364" r="27" fill="#d9a06c"/>
        <path d="M60 366Q60 334 89 334Q118 334 118 366L114 352L108 357L102 351L96 357L90 351L84 357L78 351L72 357L66 351z" fill="#7a4a26"/>
        <path d="M72 340v10M82 337v12M92 337v12M102 339v10" stroke="#5a3418" stroke-width="1.6"/>
        <path d="M70 342l19-48 19 48z" fill="#ff6fb5"/><circle cx="89" cy="292" r="5" fill="#f7d333"/>
        <path d="M76 330h26M80 318h18" stroke="#f7d333" stroke-width="3"/>
        <path d="M74 357q5-5 10-1M94 354q5-3 10 2" fill="none" stroke-width="2"/>
        <circle cx="80" cy="364" r="4.5" fill="#fff" stroke-width="1.5"/><circle cx="98" cy="364" r="4.5" fill="#fff" stroke-width="1.5"/>
        <circle id="pupL" cx="82" cy="365" r="2.2" fill="#333" stroke="none"/><circle id="pupR" cx="96" cy="365" r="2.2" fill="#333" stroke="none"/>
        <path id="wesMouth" d="M79 374q10 9 20 0" fill="none"/>
      </g>

      <!-- speech bubble -->
      <g id="bubble">
        <rect x="14" y="10" width="372" height="122" rx="18" fill="#fff" stroke="#333" stroke-width="3"/>
        <path d="M218 130l18 16 2-16" fill="#fff" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
        <path d="M220 129h16" stroke="#fff" stroke-width="5"/>
        <text class="rtext" text-anchor="middle">
          <tspan x="200" y="40"  class="rl"></tspan>
          <tspan x="200" y="66"  class="rl"></tspan>
          <tspan x="200" y="92"  class="rl"></tspan>
          <tspan x="200" y="118" class="rl" style="fill:#e8413c"></tspan>
        </text>
      </g>

      <text class="hint3" x="200" y="590" text-anchor="middle">👆 pull the lid off the big present!</text>
    </svg>
  </div>

  <!-- PAGE 2: the message -->
  <div class="page" id="p2">
    <div class="edge"></div>
    <div class="msg">
      <span class="hi" style="animation-delay:.3s">Happy birthday Wesley!</span>
      <span style="animation-delay:1.0s">I hope you have a</span>
      <span style="animation-delay:1.5s">good birthday at</span>
      <span style="animation-delay:2.0s">Robo Hub. 🤖 And</span>
      <span style="animation-delay:2.6s">also I hope you like</span>
      <span style="animation-delay:3.1s">your birthday present.</span>
      <span style="animation-delay:3.7s">And see what is</span>
      <span style="animation-delay:4.2s">inside of the big</span>
      <span style="animation-delay:4.7s">present in this</span>
      <span style="animation-delay:5.2s">birthday card.</span>
    </div>
    <div class="rule"></div>
    <svg class="gift2" viewBox="0 0 60 70"><path d="M28 18C14 0 6 10 26 18M32 18C46 0 54 10 34 18" fill="none" stroke="#4a8a2a" stroke-width="4"/><rect x="8" y="18" width="44" height="48" fill="#8fd15a" stroke="#333" stroke-width="2.5"/><path d="M30 18v48M8 40h44" stroke="#e8742c" stroke-width="5"/></svg>
  </div>

  <!-- PAGE 1: cover -->
  <div class="page" id="p1">
    <svg id="cover" viewBox="0 0 400 600">
      <defs>
        <filter id="crayon"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
        <pattern id="skyTex" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(70)">
          <rect width="10" height="10" fill="#cfe9f7"/><path d="M0 2h10M0 6h10" stroke="#a9d6ef" stroke-width="2"/>
        </pattern>
        <pattern id="grassTex" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
          <rect width="8" height="8" fill="#9fdc5a"/><path d="M0 2h8M0 5h8" stroke="#7fcc3a" stroke-width="2"/>
        </pattern>
      </defs>

      <rect width="400" height="600" fill="url(#skyTex)" filter="url(#crayon)"/>

      <!-- sun -->
      <g class="rays" stroke="#f3d33a" stroke-width="5" stroke-linecap="round">
        <path d="M400 0l-120 0M400 0l-110 50M400 0l-85 85M400 0l-50 110M400 0l0 120M400 0l-110 -50M400 0l50 -110"/>
      </g>
      <circle cx="400" cy="0" r="72" fill="#f9e24a" stroke="#333" stroke-width="2.5" filter="url(#crayon)"/>

      <!-- birds -->
      <g class="bird"><path class="flap" d="M40 120q8-8 16 0q8-8 16 0" fill="none" stroke="#333" stroke-width="2.5"/></g>
      <g class="bird" style="animation-delay:-4s;animation-duration:12s"><path class="flap" d="M20 175q6-6 12 0q6-6 12 0" fill="none" stroke="#333" stroke-width="2"/></g>

      <!-- HAPPY BIRTHDAY -->
      <g font-family="Patrick Hand" font-size="78" stroke="#333" stroke-width="2" paint-order="stroke" text-anchor="middle" filter="url(#crayon)">
        <text class="letter" x="62"  y="98" fill="#e2413c" style="animation-delay:0s">H</text>
        <text class="letter" x="117" y="98" fill="#f39a2c" style="animation-delay:.1s">A</text>
        <text class="letter" x="168" y="98" fill="#f5d93a" style="animation-delay:.2s">P</text>
        <text class="letter" x="216" y="98" fill="#9edc4a" style="animation-delay:.3s">P</text>
        <text class="letter" x="264" y="98" fill="#4cae3a" style="animation-delay:.4s">Y</text>
        <text class="letter" x="50"  y="190" fill="#4a4f9c" style="animation-delay:.5s">B</text>
        <text class="letter" x="90"  y="190" fill="#7a3fb0" style="animation-delay:.6s">I</text>
        <text class="letter" x="125" y="190" fill="#d33e8c" style="animation-delay:.7s">R</text>
        <text class="letter" x="168" y="190" fill="#e2413c" style="animation-delay:.8s">T</text>
        <text class="letter" x="212" y="190" fill="#f39a2c" style="animation-delay:.9s">H</text>
        <text class="letter" x="258" y="190" fill="#f5d93a" style="animation-delay:1s">D</text>
        <text class="letter" x="304" y="190" fill="#9edc4a" style="animation-delay:1.1s">A</text>
        <text class="letter" x="348" y="190" fill="#4cae3a" style="animation-delay:1.2s">Y</text>
      </g>

      <!-- clouds -->
      <g fill="#fff" stroke="#333" stroke-width="2.5">
        <path class="cloudA" d="M30 315c-10-40 50-45 70-30 15-35 85-30 90 5 30-10 45 30 25 30H35z"/>
        <path class="cloudB" d="M255 290c-5-30 40-35 55-20 20-25 75-15 70 15 20 0 15 25 0 25H260z"/>
      </g>

      <!-- tree -->
      <g class="tree" filter="url(#crayon)" stroke="#333" stroke-width="2.5">
        <path d="M318 548c6-60 4-140 0-210h22c-4 70-6 150 2 210z" fill="#9b4f86"/>
        <path d="M285 360c-30-10-25-55 0-55-15-40 30-55 50-35 15-25 60-15 55 15 30 5 25 55 0 60 15 30-25 50-45 30-15 20-55 15-60-15z" fill="#a8dd5a"/>
        <path d="M329 420l-20-60M329 400l18-55M329 380l0-55" stroke="#9b4f86" stroke-width="6" fill="none"/>
      </g>

      <!-- big basket of balloons -->
      <g id="basket" stroke="#333" stroke-width="2.2">
        <g id="basketBalloons">
          <ellipse cx="48" cy="488" rx="15" ry="19" fill="#e2413c" transform="rotate(-20 48 488)"/>
          <ellipse cx="72" cy="478" rx="16" ry="20" fill="#f5d93a"/>
          <ellipse cx="98" cy="484" rx="15" ry="19" fill="#6a6fd0" transform="rotate(15 98 484)"/>
          <ellipse cx="60" cy="500" rx="14" ry="17" fill="#6cc04a" transform="rotate(-10 60 500)"/>
          <ellipse cx="86" cy="498" rx="14" ry="17" fill="#ff6fb5" transform="rotate(10 86 498)"/>
          <ellipse cx="112" cy="500" rx="12" ry="15" fill="#f39a2c" transform="rotate(25 112 500)"/>
          <ellipse cx="38" cy="504" rx="12" ry="15" fill="#2f8be0" transform="rotate(-30 38 504)"/>
        </g>
        <path d="M24 508h106l-10 48H34z" fill="#c98a4a"/>
        <path d="M27 522h100M30 538h94M50 508l2 48M72 508v48M94 508l-2 48M114 508l-4 48" stroke="#8a5a2a" stroke-width="2" fill="none"/>
        <path d="M24 508h106" stroke-width="5" stroke="#8a5a2a"/>
      </g>
      <!-- air pump -->
      <g id="pump" stroke="#333" stroke-width="2.2">
        <path d="M232 548c20 4 30-10 26-38l-2-22" fill="none" stroke="#333" stroke-width="5"/>
        <path d="M232 548c20 4 30-10 26-38l-2-22" fill="none" stroke="#3a3a3a" stroke-width="3"/>
        <rect x="252" y="482" width="8" height="10" rx="2" fill="#888"/>
        <rect x="208" y="550" width="38" height="7" rx="3" fill="#555"/>
        <g id="pumpHandle">
          <path d="M227 470v40" stroke="#777" stroke-width="4"/>
          <rect x="210" y="464" width="34" height="9" rx="4" fill="#333"/>
        </g>
        <rect x="219" y="492" width="16" height="58" rx="3" fill="#e2413c"/>
        <path d="M222 500h10" stroke="#fff" stroke-width="2"/>
      </g>
      <!-- balloons layer (JS) -->
      <g id="balloons"></g>

      <!-- grass -->
      <path d="M0 560c80-28 260-30 400-6V600H0z" fill="url(#grassTex)" stroke="#333" stroke-width="2.5" filter="url(#crayon)"/>

      <!-- Miles -->
      <g id="miles" stroke="#333" stroke-width="2.2" stroke-linejoin="round">
        <!-- legs & shoes -->
        <path d="M150 505l-6 45M168 505l4 45" stroke="#5a3a2a" stroke-width="9" stroke-linecap="round"/>
        <ellipse cx="141" cy="553" rx="12" ry="7" fill="#3f55b5"/>
        <ellipse cx="175" cy="553" rx="12" ry="7" fill="#3f55b5"/>
        <!-- shirt -->
        <path d="M138 440h44l6 68h-56z" fill="#b5e08a"/>
        <!-- arms: one holding balloon up to mouth -->
        <path d="M138 452l-12 30" stroke="#e0a868" stroke-width="7" stroke-linecap="round"/>
        <path id="armR" d="M182 452L222 470" stroke="#e0a868" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path id="armR2" d="M160 462L222 470" stroke="#e0a868" stroke-width="7" stroke-linecap="round" fill="none"/>
        <!-- head -->
        <g id="head">
          <!-- curly brown hair -->
          <g fill="#6b4226" stroke="#3d2414" stroke-width="1.8">
            <circle cx="142" cy="398" r="11"/><circle cx="152" cy="386" r="11"/><circle cx="166" cy="382" r="11"/>
            <circle cx="180" cy="388" r="11"/><circle cx="187" cy="401" r="10"/><circle cx="137" cy="412" r="9"/>
            <circle cx="190" cy="415" r="9"/>
          </g>
          <ellipse cx="163" cy="413" rx="23" ry="25" fill="#e8b47a"/>
          <g fill="#6b4226" stroke="none">
            <circle cx="148" cy="394" r="7"/><circle cx="160" cy="390" r="7"/><circle cx="172" cy="390" r="7"/><circle cx="182" cy="397" r="6"/>
          </g>
          <circle cx="155" cy="410" r="2.4" fill="#333" stroke="none"/>
          <circle cx="171" cy="410" r="2.4" fill="#333" stroke="none"/>
          <!-- cheeks (puff when blowing) -->
          <circle id="cheekL" cx="150" cy="421" r="4" fill="#f29a8a" stroke="none" opacity=".7"/>
          <circle id="cheekR" cx="176" cy="421" r="4" fill="#f29a8a" stroke="none" opacity=".7"/>
          <path id="smile" d="M155 424q8 8 16 0" fill="none" stroke="#333" stroke-width="2.2"/>
        </g>
      </g>

      <text class="hint" x="16" y="590">tap the balloons to pop them!</text>
    </svg>
  </div>
</div>

<div class="nav">
  <button class="btn back" id="prev" aria-label="Back" disabled>◀</button>
  <div class="dots"><i class="on"></i><i></i><i></i></div>
  <button class="btn" id="next" aria-label="Next page">▶</button>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const pages = [p1, p2, p3];
  let cur = 0;
  const dots = document.querySelectorAll(".dots i");

  // ---------- sounds (tiny, made with WebAudio) ----------
  let ac;
  const audio = () => (ac ||= new (window.AudioContext || window.webkitAudioContext)());
  function tone(freq, dur, type = "sine", vol = .15, slide = 0) {
    try {
      const a = audio(), o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.value = freq;
      if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, a.currentTime + dur);
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, a.currentTime + dur);
      o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
    } catch (e) {}
  }
  function pop() {
    try {
      const a = audio(), t = a.currentTime, n = a.sampleRate * .18, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 6);
      const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      f.type = "highpass"; f.frequency.value = 700; g.gain.value = .9;
      s.buffer = b; s.connect(f).connect(g).connect(a.destination); s.start(t);
      const o = a.createOscillator(), og = a.createGain();             // little "thup" underneath
      o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(60, t + .1);
      og.gain.setValueAtTime(.35, t); og.gain.exponentialRampToValueAtTime(.001, t + .12);
      o.connect(og).connect(a.destination); o.start(t); o.stop(t + .13);
    } catch (e) {}
  }
  function thump() { tone(110, .16, "sine", .35, .5); }
  const unlock = () => { try { audio().resume(); } catch (e) {} };
  document.addEventListener("pointerdown", unlock, { capture: true });
  document.addEventListener("touchend", unlock, { capture: true });
  const swoosh = () => tone(300, .35, "triangle", .06, 2.5);
  const tada = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .35, "triangle", .12), i * 110));

  // ---------- page turning ----------
  function go(d) {
    const n = cur + d;
    if (n < 0 || n > 2) return;
    if (d > 0) pages[cur].classList.add("flipped"); else pages[n].classList.remove("flipped");
    cur = n; swoosh();
    dots.forEach((x, i) => x.classList.toggle("on", i === cur));
    prev.disabled = cur === 0; next.disabled = cur === 2;
    if (cur === 1) { p2.classList.remove("show"); void p2.offsetWidth; p2.classList.add("show"); }
  }
  next.onclick = () => go(1);
  prev.onclick = () => go(-1);
  document.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });
  // stack order: cover on top
  pages.forEach((p, i) => p.style.zIndex = 10 - i);

  // ---------- confetti ----------
  const cv = fx, cx = cv.getContext("2d"); let bits = [];
  function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
  size(); addEventListener("resize", size);
  const COLORS = ["#e8413c", "#f68b28", "#f7d333", "#4cbf4a", "#2f8be0", "#5a46b8", "#ff6fb5"];
  function burst(x, y, count = 40, power = 7) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = Math.random() * power + 2;
      bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, r: Math.random() * 6 + 3, c: COLORS[i % COLORS.length], rot: Math.random() * 6, vr: Math.random() * .4 - .2, life: 1, star: Math.random() < .25 });
    }
  }
  function drawStar(r) { cx.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r, a = i * Math.PI / 5; cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } cx.fill(); }
  (function loop() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    bits = bits.filter(b => b.life > 0 && b.y < innerHeight + 30);
    for (const b of bits) {
      b.vy += .18; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.rot += b.vr; b.life -= .006;
      cx.save(); cx.translate(b.x, b.y); cx.rotate(b.rot); cx.globalAlpha = Math.min(1, b.life * 2); cx.fillStyle = b.c;
      b.star ? drawStar(b.r) : cx.fillRect(-b.r / 2, -b.r / 4, b.r, b.r / 2);
      cx.restore();
    }
    requestAnimationFrame(loop);
  })();

  // ---------- balloons on the cover ----------
  const layer = document.getElementById("balloons");
  const BCOL = ["#f5d93a", "#6cc04a", "#c0392b", "#6a6fd0", "#f39a2c", "#ff6fb5", "#2f8be0"];
  let ci = 0, balloons = [];
  const NOZZLE = { x: 256, y: 482 };
  const INFLATE = 180;          // ~3 seconds per balloon
  const POP_EVERY = 10000;      // one balloon pops every ~10 seconds
  function makeBalloon() {
    const col = BCOL[ci++ % BCOL.length];
    const g = document.createElementNS(NS, "g"); g.classList.add("balloon");
    g.innerHTML = `
      <path class="str" d="" fill="none" stroke="#333" stroke-width="1.6"/>
      <g class="body">
        <ellipse rx="22" ry="27" fill="${col}" stroke="#333" stroke-width="2.2"/>
        <path d="M-4 26l4 6 4-6z" fill="${col}" stroke="#333" stroke-width="1.6"/>
        <ellipse cx="-8" cy="-10" rx="5" ry="8" fill="#fff" opacity=".45" transform="rotate(25 -8 -10)"/>
        <text y="9" text-anchor="middle" font-family="Patrick Hand" font-size="28" fill="#222">7</text>
      </g>`;
    layer.appendChild(g);
    const b = { g, body: g.querySelector(".body"), str: g.querySelector(".str"), state: "inflate", t: 0, x: NOZZLE.x, y: NOZZLE.y - 8, s: .1, sway: Math.random() * 6, vx: (Math.random() - .3) * .5 };
    const popIt = e => {
      e.stopPropagation(); if (b.state === "gone") return;
      const r = b.g.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 3, 30, 6); pop();
      b.state = "gone"; g.remove();
      if (b === active) { active = null; setTimeout(startNext, 400); }
    };
    g.addEventListener("pointerdown", popIt);
    return b;
  }

  let active = null;
  function setPump(d) {
    const dy = d * 22;
    pumpHandle.setAttribute("transform", `translate(0 ${dy})`);
    armR.setAttribute("d", `M182 452L222 ${470 + dy}`);
    armR2.setAttribute("d", `M160 462L222 ${470 + dy}`);
  }
  function popOne() {
    const up = balloons.filter(b => b.state === "rise" && b.y < 420 && b.y > 30);
    if (!up.length) return;
    const b = up.reduce((a, c) => (c.y < a.y ? c : a));  // the highest one
    const r = b.g.getBoundingClientRect();
    if (cur === 0) { burst(r.left + r.width / 2, r.top + r.height / 3, 30, 6); pop(); }
    b.state = "gone"; b.g.remove();
  }
  setInterval(popOne, POP_EVERY);
  function startNext() { if (!active) { active = makeBalloon(); balloons.push(active); } }

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(50, now - last) / 16.67; last = now;
    for (const b of balloons) {
      if (b.state === "gone") continue;
      b.t += dt;
      if (b.state === "inflate") {
        // pump strokes: 4 pushes, the balloon grows a bit with each one
        const stroke = (b.t % (INFLATE / 4)) / (INFLATE / 4);   // 0..1
        const down = stroke < .5 ? stroke * 2 : 2 - stroke * 2;  // handle down then up
        setPump(down);
        const target = Math.min(1, .12 + Math.floor(b.t / (INFLATE / 4)) * .22 + (stroke < .5 ? down * .22 : .22));
        b.s += (target - b.s) * .2 * dt;
        b.x = NOZZLE.x; b.y = NOZZLE.y - 6 - 27 * b.s;
        if (b.t >= INFLATE) {
          b.state = "rise"; b.t = 0; active = null; setPump(0);
          tone(700, .25, "sine", .07, 1.6);
          setTimeout(startNext, 150);
        }
      } else if (b.state === "rise") {
        b.y -= (.55 + Math.min(b.t / 120, .3)) * dt;
        b.x += (b.vx + Math.sin((b.t + b.sway * 20) / 30) * .5) * dt;
        if (b.y < -80) { b.state = "gone"; b.g.remove(); }
      }
      const rot = b.state === "rise" ? Math.sin((b.t + b.sway * 20) / 30) * 8 : 0;
      b.body.setAttribute("transform", `translate(${b.x} ${b.y}) rotate(${rot}) scale(${b.s})`);
      // string
      const tx = b.x - Math.sin(rot * Math.PI / 180) * 32 * b.s, ty = b.y + 32 * b.s;
      const L = 30 + 60 * b.s, wob = Math.sin(b.t / 8) * 6;
      b.str.setAttribute("d", b.state === "inflate" ? "" : `M${tx} ${ty} q${wob} ${L / 3} 0 ${L / 1.6} t0 ${L / 1.6}`);
    }
    balloons = balloons.filter(b => b.state !== "gone");
    requestAnimationFrame(tick);
  }
  // a few balloons already floating when the card opens
  [[90, 330], [200, 260], [300, 150], [60, 200]].forEach(([x, y], i) => {
    const b = makeBalloon(); b.state = "rise"; b.s = 1; b.x = x; b.y = y; b.t = i * 40; balloons.push(b);
  });
  startNext();
  requestAnimationFrame(tick);
  // first tap anywhere: a little confetti hello
  let hello = false;
  document.getElementById("cover").addEventListener("pointerdown", e => { if (!hello) { hello = true; burst(e.clientX, e.clientY, 25, 5); } });

  // ---------- giant present + robot ----------
  const LINES = ["HAP-PY BIRTH-DAY,", "WES-LEY! HERE-IS-YOUR", "PRES-ENT FROM MI-LES.", "BEEP-BOP-BOOP!"];
  const lid3 = document.getElementById("lid3"), svg3 = document.getElementById("p3svg");
  const robot = document.getElementById("robot"), hint3 = document.querySelector(".hint3");
  const tsp = [...document.querySelectorAll(".rl")];
  let state = "closed", drag3 = false, sy = 0, lift = 0, moved3 = false, talkTimer, runId = 0;
  const unit = () => 600 / svg3.getBoundingClientRect().height;
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function beeps(fs = [880, 660, 990]) { fs.forEach((f, i) => setTimeout(() => tone(f, .18, "square", .07), i * 220)); }
  // robot voice (uses the phone's speech voice, deep and slow)
  function say(text, then) {
    let done = false; const fin = () => { if (!done) { done = true; then && then(); } };
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.pitch = .1; u.rate = .8; u.volume = 1;
      const v = speechSynthesis.getVoices().find(v => /^en/i.test(v.lang)); if (v) u.voice = v;
      u.onend = fin; u.onerror = fin;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
      setTimeout(fin, 1200 + text.length * 110);          // safety net if onend never fires
    } catch (e) { setTimeout(fin, 2500); }
  }
  function typeOut(lines) {
    clearInterval(talkTimer); tsp.forEach(t => t.textContent = "");
    p3.classList.add("talking");
    let li = 0, ci2 = 0;
    return new Promise(res => {
      talkTimer = setInterval(() => {
        if (li >= lines.length) { clearInterval(talkTimer); p3.classList.remove("talking"); res(); return; }
        tsp[li].textContent = lines[li].slice(0, ++ci2);
        if (ci2 >= lines[li].length) { li++; ci2 = 0; }
      }, 65);
    });
  }
  // ball helpers
  const ballAt = (x, y, rot = 0, k = 1) => ball3.setAttribute("transform", `translate(${x} ${y}) rotate(${rot}) scale(${k}) translate(-240 -262)`);
  function animate(ms, fn) {
    return new Promise(res => { const t0 = performance.now();
      (function f(now) { const t = Math.min(1, (now - t0) / ms); fn(t); t < 1 ? requestAnimationFrame(f) : res(); })(t0); });
  }
  const bez = (a, c, b, t) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * c + t * t * b;
  const wesPose = (l, r) => { wesArmL.setAttribute("d", l); wesArmR.setAttribute("d", r); };

  async function show() {
    const id = ++runId; state = "busy";
    clearTimeout(idle); p3.classList.remove("done", "waitball"); p3.classList.add("popped", "still");
    // put the ball back with the robot
    svg3.insertBefore(ball3, lid3); ball3.style.display = "none"; robotBall.style.display = "";
    wes.classList.remove("jump");
    // robot springs up and starts talking right away
    robot.style.transition = ""; robot.style.transform = "translateY(0)";
    tone(200, .5, "sine", .12, 4);
    wesPose("M68 402L50 336", "M108 402L128 336");
    wesMouth.setAttribute("d", "M79 372q10 16 20 0z"); wesMouth.setAttribute("fill", "#a33");
    pupL.setAttribute("cx", 80); pupR.setAttribute("cx", 98); pupL.setAttribute("cy", 363); pupR.setAttribute("cy", 363);
    setTimeout(() => wes.classList.add("jump"), 300);
    const r = svg3.getBoundingClientRect();
    setTimeout(() => { burst(r.left + r.width * .6, r.top + r.height * .45, 110, 11); tada(); }, 450);
    let spoke; const spoken = new Promise(res => spoke = res);
    say("Hap-py, birth-day, Wes-ley! Here, is, your, pres-ent, from Mi-les. Beep. Bop. Boop.", () => { beeps(); spoke(); });
    await Promise.all([typeOut(LINES), spoken]); if (id !== runId) return;
    await wait(500); if (id !== runId) return;
    // now they play catch: tap the basketball to pass it
    owner = "robot"; state = "play";
    hint3.textContent = "👆 Tap the basketball to pass it!";
    p3.classList.add("waitball");
  }

  let owner = "robot", idle;
  const R = () => svg3.getBoundingClientRect();
  async function robotPass() {
    if (state !== "play" || owner !== "robot") return;
    state = "passing"; clearTimeout(idle); p3.classList.add("still");
    robotBall.style.display = "none"; svg3.insertBefore(ball3, lid3); ball3.style.display = ""; ballAt(240, 262);
    for (let i = 0; i < 2; i++) { await animate(320, t => ballAt(240, 262 + 44 * Math.sin(Math.PI * t))); thump(); }
    wes.classList.remove("jump");
    wesPose("M68 402L56 432", "M108 402L122 432");
    await animate(650, t => ballAt(bez(240, 200, 142, t), bez(262, 120, 530, t), -t * 300, 1 - .2 * t)); thump();
    await animate(520, t => ballAt(bez(142, 112, 90, t), bez(530, 360, 440, t), -300 - t * 200, .8));
    thump(); tone(660, .12, "triangle", .1);
    wesPose("M68 402L67 440", "M108 402L112 440");
    wes.appendChild(ball3); ballAt(90, 440, -500, .8); wes.appendChild(wesArms);
    const r = R(); burst(r.left + r.width * .22, r.top + r.height * .72, 40, 7);
    owner = "wes"; state = "play"; p3.classList.remove("still");
    setTimeout(() => { if (owner === "wes") wes.classList.add("jump"); }, 400);
    idle = setTimeout(goHome, 8000);                       // nobody passed back for a while: robot says bye
  }
  async function wesPass() {
    if (state !== "play" || owner !== "wes") return;
    state = "passing"; clearTimeout(idle); wes.classList.remove("jump"); p3.classList.add("still");
    await wait(30);
    svg3.insertBefore(ball3, lid3); ballAt(90, 440, 0, .8);
    wesPose("M68 402L84 414", "M108 402L124 400");          // push pass
    tone(400, .1, "triangle", .08);
    await animate(480, t => ballAt(bez(90, 115, 142, t), bez(440, 380, 530, t), t * 200, .8)); thump();
    wesPose("M68 402L50 336", "M108 402L128 336");
    await animate(650, t => ballAt(bez(142, 200, 240, t), bez(530, 120, 262, t), 200 + t * 160, .8 + .2 * t));
    thump(); tone(880, .12, "square", .06);
    ball3.style.display = "none"; robotBall.style.display = "";
    owner = "robot"; state = "play";
    wes.classList.add("jump");
  }
  async function goHome() {
    if (state !== "play" || owner !== "wes") return;
    state = "busy"; p3.classList.remove("waitball");
    tsp.forEach(t => t.textContent = ""); tsp[1].textContent = "BEEP-BOOP!";
    p3.classList.add("talking");
    say("Beep. Boop.", () => {}); beeps([990, 520]);
    await wait(1400);
    p3.classList.remove("talking", "popped");
    robot.style.transition = "transform .7s cubic-bezier(.6,-.3,.8,.5)"; robot.style.transform = "translateY(215px)";
    tone(900, .5, "sine", .1, .2);
    await wait(800);
    hint3.textContent = "👆 Tap the present to see the robot again!";
    p3.classList.add("popped", "done");
    state = "done";
  }
  robotBall.addEventListener("pointerdown", e => { e.stopPropagation(); robotPass(); });
  ball3.addEventListener("pointerdown", e => { e.stopPropagation(); wesPass(); });

  function openLid() {
    if (state !== "closed") return;
    lid3.style.transform = ""; lid3.classList.add("gone");
    show();
  }
  lid3.addEventListener("pointerdown", e => { if (state !== "closed") return; drag3 = true; moved3 = false; lift = 0; sy = e.clientY; lid3.setPointerCapture(e.pointerId); });
  lid3.addEventListener("pointermove", e => {
    if (!drag3) return;
    const dy = (sy - e.clientY) * unit(); if (Math.abs(dy) > 5) moved3 = true;
    lift = Math.max(0, Math.min(dy, 120)); lid3.style.transform = `translate(0px, ${-lift}px) rotate(${-lift / 8}deg)`;
  });
  // the robot appears when the finger lets go (that also lets the phone talk)
  const end3 = () => { if (!drag3) return; drag3 = false; if (!moved3 || lift > 30) openLid(); else lid3.style.transform = ""; };
  lid3.addEventListener("pointerup", end3); lid3.addEventListener("pointercancel", () => { drag3 = false; lid3.style.transform = ""; });
  const again = () => { if (state === "done") show(); };
  boxFront.addEventListener("pointerdown", again); robot.addEventListener("pointerdown", again);
  try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch (e) {}
})();
</script>
</body>
</html>

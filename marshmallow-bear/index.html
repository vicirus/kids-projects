<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Marshmallow Bear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* VOICE: a kid's bedtime cartoon, warm and a little spooky
   IDEA: Miles's crayon drawing taped to the wall, come to life
   PICTURE: the film itself, drawn in his crayon style
   COLOUR and TYPE: pencil-grey night, campfire orange, grass green; Patrick Hand
   LAYOUT: modest title, big film, big caption, chunky buttons */
:root{color-scheme:light dark;--bg:light-dark(#f4f1e8,#1c1c21);--ink:light-dark(#26262b,#f1eee6);--card:light-dark(#fffdf7,#2a2a30);--fire:#f2841f;--grass:#5bb04a;--muted:light-dark(#6b6a66,#a9a69e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 "Patrick Hand","Comic Sans MS",system-ui,sans-serif;overflow-x:clip}
main{max-width:1000px;margin:0 auto;padding:clamp(14px,3vw,36px) max(3vw,10px) 40px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0;font-weight:400;text-wrap:balance}
.by{margin:4px 0 14px;color:var(--muted);font-size:20px}
.stage{position:relative;background:#111;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);aspect-ratio:1200/850}
canvas{display:block;width:100%;height:100%}
.big{position:absolute;inset:0;margin:auto;width:min(320px,70%);height:76px;border:0;border-radius:40px;background:var(--fire);color:#fff;font:30px "Patrick Hand",sans-serif;cursor:pointer;box-shadow:0 6px 0 #b85a0c,0 10px 30px rgba(0,0,0,.4)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #b85a0c}
.big[hidden]{display:none}
.cap{background:var(--card);border-radius:10px;margin:12px 0 0;padding:14px 18px;font-size:clamp(20px,3vw,26px);min-height:3.6em;line-height:1.3}
.bar{display:flex;gap:4px;margin:14px 0 10px}
.bar button{flex:1;height:22px;padding:0;border:0;border-radius:6px;background:light-dark(#dcd8cc,#3a3a42);overflow:hidden;cursor:pointer;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--grass);width:0}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctl button{min-height:48px;padding:0 20px;border-radius:24px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:22px "Patrick Hand",sans-serif;cursor:pointer}
.ctl button.main{background:var(--fire);border-color:var(--fire);color:#fff;min-width:120px}
.ctl label{display:flex;align-items:center;gap:8px;font-size:22px;margin-left:auto;cursor:pointer;min-height:48px}
.ctl input{width:24px;height:24px;accent-color:var(--grass)}
button:focus-visible,input:focus-visible{outline:3px solid var(--grass);outline-offset:2px}
.home{display:inline-block;color:var(--muted);text-decoration:none;font-size:20px;margin-bottom:6px;min-height:44px;line-height:44px}.home:hover{color:var(--fire)}
.more{margin-top:28px}.more h2{font-size:28px;font-weight:400;margin:0 0 10px}.more div{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.more a{background:var(--card);border-radius:12px;padding:12px 16px;color:var(--ink);text-decoration:none;font-size:22px;border:2px solid transparent}.more a:hover{border-color:var(--fire)}
.note{color:var(--muted);font-size:16px;margin-top:18px}
@media(max-width:600px){.ctl button{padding:0 14px;font-size:20px}.ctl label{margin-left:0}}
</style>
</head>
<body>
<main>
<a class="home" href="../">&larr; Kids' Projects</a>
<h1>Jeff, Will and the Marshmallow Bear</h1>
<p class="by">A story and drawing by Miles</p>
<div class="stage"><canvas id="film" aria-label="Animated story"></canvas><button id="big" class="big">Loading…</button></div>
<p id="cap" class="cap" aria-live="polite"></p>
<div class="bar" id="bar"></div>
<div class="ctl">
<button id="prev">◀ Back</button>
<button id="play" class="main">Play</button>
<button id="next">Next ▶</button>
<button id="again">Start over</button>
<label><input type="checkbox" id="voice" checked> Read it to me</label>
</div>
<p class="note">The first and last pictures are Miles's real drawing. Everything else is drawn in his style.</p>
<nav class="more"><h2>More kids' projects</h2><div>
<a href="../planets/">Planets and their moons</a>
<a href="../birthday-cards/">Birthday cards</a>
<a href="../jamies-castle/">Jamie's Looping Castle</a>
<a href="../miles-house/">Miles's Giant House</a>
<a href="../">See them all &rarr;</a>
</div></nav>
<img id="pic" src="drawing.jpg" alt="" hidden>
</main>
<script>
{
const W=1200,H=850,GY=590;
const cv=document.getElementById('film'),g=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=W*DPR;cv.height=H*DPR;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=t=>{t=clamp(t);return t*t*(3-2*t)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const back=t=>{t=clamp(t);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'};
let sn=1;const R=()=>rnd(sn++);

/* ---------- crayon helpers ---------- */
function mk(w,h,fn,s=2){const c=document.createElement('canvas');c.width=w*s;c.height=h*s;const x=c.getContext('2d');x.scale(s,s);x.lineCap='round';x.lineJoin='round';fn(x,w,h);return c}
function strokes(x,color,b,o){const gap=o.gap||3.5,sl=o.sl??0.6,[bx,by,bw,bh]=b,ext=bh*Math.abs(sl)+10;x.save();x.strokeStyle=color;x.lineWidth=o.lw||3;x.globalAlpha=o.a??.8;x.beginPath();for(let k=-ext;k<bw+ext;k+=gap){const x0=bx+k+(R()-.5)*gap*.8,y0=by+bh+4,x1=x0+bh*sl+(R()-.5)*6,y1=by-4;x.moveTo(x0,y0);x.quadraticCurveTo((x0+x1)/2+(R()-.5)*4,(y0+y1)/2,x1,y1)}x.stroke();x.restore()}
function cf(x,path,color,o={}){const b=o.box||[0,0,360,260];x.save();path(x);x.clip();x.globalAlpha=o.base??.35;x.fillStyle=color;x.fillRect(b[0],b[1],b[2],b[3]);x.globalAlpha=1;strokes(x,color,b,o);if(o.cross)strokes(x,o.cross===true?color:o.cross,b,{...o,sl:-(o.sl??0.6),a:(o.a??.8)*.6});if(o.after)o.after(x);x.restore();if(o.line!==false){path(x);x.strokeStyle=o.line||'#2a2a2a';x.lineWidth=o.ow||2.4;x.globalAlpha=.85;x.stroke();x.globalAlpha=1}}
const circ=(cx,cy,r)=>x=>{x.beginPath();x.arc(cx,cy,r,0,7)};
const ell=(cx,cy,rx,ry)=>x=>{x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7)};
const rr=(X,Y,w,h,r)=>x=>{x.beginPath();x.roundRect(X,Y,w,h,r)};
function starPath(x,cx,cy,r){x.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i*4*Math.PI/5;x[i?'lineTo':'moveTo'](cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.closePath()}

/* ---------- backgrounds ---------- */
function ground(x){const gp=x=>{x.beginPath();x.moveTo(0,GY);for(let i=0;i<=12;i++)x.lineTo(i*100,GY+(rnd(900+i)-.5)*10);x.lineTo(W,H);x.lineTo(0,H);x.closePath()};cf(x,gp,'#86c95a',{box:[0,GY-12,W,H-GY+12],gap:5,a:.55,lw:3,base:.25,line:false})}
const night=mk(W,H,x=>{sn=100;x.fillStyle='#fbf9f2';x.fillRect(0,0,W,H);
 cf(x,x=>{x.beginPath();x.rect(0,0,W,GY+3)},'#2d2d31',{box:[0,0,W,GY+6],gap:3,a:.62,lw:2.6,base:.5,cross:true,line:false});
 for(let i=0;i<30;i++){const sx=30+R()*1140,sy=20+R()*480,r=13+R()*13;x.save();starPath(x,sx,sy,r);x.fillStyle='rgba(255,226,90,.85)';x.fill('evenodd');x.fillStyle='rgba(255,226,90,.55)';x.fill();x.strokeStyle='#5c5a3a';x.lineWidth=1.6;x.stroke();x.restore()}
 ground(x)});
const day=mk(W,H,x=>{sn=300;x.fillStyle='#fbf9f2';x.fillRect(0,0,W,H);
 cf(x,x=>{x.beginPath();x.rect(0,0,W,GY+3)},'#73bdf2',{box:[0,0,W,GY+6],gap:4,a:.55,lw:3,base:.3,line:false});
 [[220,120],[640,80],[880,190]].forEach(([cx,cy])=>{const p=x=>{x.beginPath();x.arc(cx,cy,34,0,7);x.arc(cx+40,cy-14,40,0,7);x.arc(cx+86,cy,32,0,7);x.rect(cx,cy,86,30)};x.save();p(x);x.fillStyle='#fff';x.fill();x.restore()});
 ground(x)});
const dirt=mk(W,H,x=>{sn=500;x.fillStyle='#fbf9f2';x.fillRect(0,0,W,H);
 cf(x,x=>{x.beginPath();x.rect(0,0,W,H)},'#a57a4c',{box:[0,0,W,H],gap:4,a:.6,lw:3,base:.45,cross:'#8a6238',line:false});
 for(let i=0;i<40;i++){const px=R()*W,py=R()*H;cf(x,ell(px,py,6+R()*10,4+R()*6),'#9a9a96',{box:[px-20,py-20,40,40],gap:2.5,ow:1.5})}
 for(let i=0;i<60;i++){const px=i<30?R()*300:900+R()*300,py=i<30?R()*200:650+R()*200;x.strokeStyle='#5bb04a';x.lineWidth=3;x.beginPath();x.moveTo(px,py+20);x.lineTo(px+(R()-.5)*16,py);x.stroke()}});

/* ---------- sprites ---------- */
function kid(c){return mk(110,220,x=>{sn=c.seed;const sk='#f3c9a2',bx=[0,0,110,220];
 const stripes=x=>{if(!c.pj)return;x.strokeStyle=c.st;x.lineWidth=4;x.globalAlpha=.8;for(let y=86;y<200;y+=12){x.beginPath();x.moveTo(0,y);x.lineTo(110,y);x.stroke()}};
 cf(x,rr(38,140,13,58,3),c.legs,{box:bx,gap:3,after:stripes});cf(x,rr(59,140,13,58,3),c.legs,{box:bx,gap:3,after:stripes});
 cf(x,ell(44,204,12,8),c.pj?sk:c.shoes,{box:bx,gap:2.5});cf(x,ell(66,204,12,8),c.pj?sk:c.shoes,{box:bx,gap:2.5});
 for(const [a,b,d,e] of [[33,90,16,132],[77,90,93,130]]){x.strokeStyle='#2a2a2a';x.lineWidth=14;x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.stroke();x.strokeStyle=c.shirt;x.lineWidth=10;x.stroke()}
 cf(x,circ(16,134,6),sk,{box:bx,ow:1.6});cf(x,circ(93,132,6),sk,{box:bx,ow:1.6});
 cf(x,rr(28,80,54,66,8),c.shirt,{box:bx,gap:3,after:stripes});
 cf(x,circ(55,48,30),sk,{box:bx,gap:3});
 cf(x,x=>{x.beginPath();x.arc(55,48,31,Math.PI*1.02,Math.PI*1.98);if(c.long){x.lineTo(88,68);x.lineTo(80,70)}x.lineTo(82,38);for(let i=6;i>=0;i--)x.lineTo(28+i*9,i%2?40:33);if(c.long){x.lineTo(30,70);x.lineTo(22,68)}x.closePath()},c.hair,{box:bx,gap:2.5,a:.95});
 x.strokeStyle='#2a2a2a';x.lineWidth=2.4;x.beginPath();x.arc(45,50,4,Math.PI*1.15,Math.PI*1.85);x.moveTo(69,50);x.arc(65,50,4,Math.PI*1.15,Math.PI*1.85);x.moveTo(64,59);x.arc(55,57,9,.15*Math.PI,.85*Math.PI);x.stroke()})}
const JEFF=kid({seed:11,hair:'#1b1b1b',shirt:'#4f8fd8',legs:'#5bb04a',shoes:'#d8443a'});
const WILL=kid({seed:22,hair:'#6b4226',shirt:'#7a5cc9',legs:'#f2d23c',shoes:'#5a4bb0',long:1});
const JEFFPJ=kid({seed:33,hair:'#1b1b1b',shirt:'#a9d8f2',legs:'#a9d8f2',st:'#4f8fd8',pj:1});
const WILLPJ=kid({seed:44,hair:'#6b4226',shirt:'#f5bcd6',legs:'#f5bcd6',st:'#c0619a',pj:1,long:1});
let BAG,BAGE,TENT,TENTO,BEAR,LOGS,FOOT;
function sprites(){
 BAG=mk(120,150,x=>{sn=600;const p=x=>{x.beginPath();x.moveTo(18,40);x.lineTo(102,40);x.lineTo(110,146);x.lineTo(10,146);x.closePath()};cf(x,p,'#bfe0ff',{box:[0,0,120,150]});
  cf(x,x=>{x.beginPath();x.moveTo(16,42);for(let i=0;i<=8;i++)x.lineTo(16+i*11,i%2?22:30);x.lineTo(104,42);x.closePath()},'#e8473a',{box:[0,0,120,150]});
  x.fillStyle='#d23a2e';x.font='22px "Patrick Hand",sans-serif';x.textAlign='center';x.fillText('MARSH',60,78);x.fillText('MALLOWS',60,100);
  for(const m of [38,60,82])cf(x,rr(m-9,112,18,20,6),'#ffffff',{box:[0,0,120,150],ow:1.6})});
 BAGE=mk(160,80,x=>{sn=650;const p=x=>{x.beginPath();x.moveTo(10,72);x.lineTo(118,74);[[146,62],[132,56],[150,46],[134,38],[146,28]].forEach(q=>x.lineTo(q[0],q[1]));x.lineTo(118,30);x.lineTo(14,36);x.closePath()};cf(x,p,'#bfe0ff',{box:[0,0,160,80]});
  x.fillStyle='#d23a2e';x.font='18px "Patrick Hand",sans-serif';x.fillText('MARSHMALLOWS',18,60)});
 const tent=open=>mk(320,240,x=>{sn=700;cf(x,x=>{x.beginPath();x.moveTo(8,232);x.lineTo(160,10);x.lineTo(312,232);x.closePath()},'#f08a24',{box:[0,0,320,240],gap:3.5});
  cf(x,x=>{x.beginPath();x.moveTo(108,232);x.lineTo(160,92);x.lineTo(212,232);x.closePath()},open?'#3a2414':'#c4581a',{box:[0,0,320,240],gap:3});
  x.strokeStyle='#2a2a2a';x.lineWidth=2.4;x.beginPath();if(!open){x.moveTo(160,96);x.lineTo(160,232)}else{x.moveTo(108,232);x.quadraticCurveTo(92,170,140,140);x.moveTo(212,232);x.quadraticCurveTo(228,170,180,140)}x.moveTo(160,10);x.lineTo(160,0);x.moveTo(40,186);x.lineTo(2,236);x.moveTo(280,186);x.lineTo(318,236);x.stroke()});
 TENT=tent(0);TENTO=tent(1);
 BEAR=mk(340,240,x=>{sn=800;const b=[0,0,340,240],o={box:b,gap:3,cross:'#120c07'};
  for(const lx of [250,215,95,60])cf(x,rr(lx,140,38,92,14),'#3a2616',o);
  cf(x,ell(190,128,132,78),'#3a2616',o);
  cf(x,circ(42,50,17),'#3a2616',o);cf(x,circ(98,46,17),'#3a2616',o);
  cf(x,circ(70,96,52),'#3a2616',o);
  cf(x,ell(32,114,28,19),'#7a5233',{box:b,gap:3});cf(x,circ(10,106,8),'#111',{box:b});
  x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();for(const lx of [60,95,215,250])for(let k=0;k<3;k++){x.moveTo(lx+6+k*12,228);x.lineTo(lx+2+k*12,238)}x.stroke()});
 LOGS=mk(260,140,x=>{sn=900;const ends=[[18,112],[62,126],[108,134],[152,134],[198,126],[242,112]],ax=130,ay=26;
  ends.forEach(([ex,ey],i)=>{const dx=ex-ax,dy=ey-ay,L=Math.hypot(dx,dy),nx=-dy/L*13,ny=dx/L*13;cf(x,x=>{x.beginPath();x.moveTo(ax+nx,ay+ny);x.lineTo(ex+nx,ey+ny);x.lineTo(ex-nx,ey-ny);x.lineTo(ax-nx,ay-ny);x.closePath()},i%2?'#6e4528':'#7d5232',{box:[0,0,260,140],gap:3});
   cf(x,circ(ex,ey,14),'#a4774f',{box:[0,0,260,140],gap:2.5});x.strokeStyle='#2a2a2a';x.lineWidth=1.6;x.beginPath();x.arc(ex,ey,6,0,7);x.stroke()})});
 FOOT=mk(120,160,x=>{sn=950;const b=[0,0,120,160],c='#3b2a1c';cf(x,x=>{x.beginPath();x.moveTo(60,62);x.bezierCurveTo(110,58,112,120,92,140);x.bezierCurveTo(78,156,42,156,28,140);x.bezierCurveTo(8,120,10,58,60,62);x.closePath()},c,{box:b,gap:2.5});
  [[16,52],[34,34],[60,26],[86,34],[104,52]].forEach(([tx,ty])=>{cf(x,ell(tx,ty,10,13),c,{box:b,gap:2.5});x.strokeStyle='#1a120b';x.lineWidth=3;x.beginPath();x.moveTo(tx,ty-13);x.lineTo(tx+(tx-60)*.08,ty-25);x.stroke()})});
}

/* ---------- drawing parts ---------- */
function cam(z=1,cx=W/2,cy=H/2,sx=0,sy=0){g.setTransform(DPR*z,0,0,DPR*z,DPR*(W/2-cx*z+sx),DPR*(H/2-cy*z+sy))}
function spr(c,x,y,w,h,ax=.5,ay=1){g.drawImage(c,x-w*ax,y-h*ay,w,h)}
function say(txt,x,y,size,fill,stroke,a=1,p=1,rot=0){if(a<=0)return;g.save();g.globalAlpha*=a;g.translate(x,y);g.rotate(rot);g.scale(p,p);g.font=size+'px "Patrick Hand",sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=size*.2;g.strokeStyle=stroke;g.strokeText(txt,0,0);g.fillStyle=fill;g.fillText(txt,0,0);g.restore()}
function word(t,a,b,txt,x,y,size,fill,stroke,rot=0){if(t<a||t>b)return;say(txt,x,y,size,fill,stroke,1-seg(t,b-.35,b),back(seg(t,a,a+.35)),rot)}
function flamePath(cx,by,w,h,seed){g.beginPath();g.moveTo(cx-w/2,by);const n=5;for(let i=0;i<n;i++){const f=(i+.5)/n,hh=h*(1-Math.abs(f-.5)*1.25)*(.82+rnd(seed+i*3)*.3);g.lineTo(cx-w/2+w*f+(rnd(seed+i*5)-.5)*w*.08,by-hh);if(i<n-1)g.lineTo(cx-w/2+w*(i+1)/n,by-hh*(.38+rnd(seed+i*7)*.15))}g.lineTo(cx+w/2,by);g.quadraticCurveTo(cx,by+h*.1,cx-w/2,by);g.closePath()}
function flame(cx,by,w,h,t,k=0){if(h<2)return;const q=Math.floor(t*9)+k*31;[['#e8473a','#a8241c',1,1],['#f7932f','#c4621a',.72,.74],['#ffe14d','#d9a520',.44,.48]].forEach(([f,s,ws,hs],j)=>{flamePath(cx,by,w*ws,h*hs,q*13+j*101+k*7);g.fillStyle=f;g.fill();g.strokeStyle=s;g.lineWidth=2;g.stroke()})}
function glow(x,y,r,t,a=.38){const fl=.85+.15*Math.sin(t*11)*Math.sin(t*7.3);g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(x,y,10,x,y,r*fl);gr.addColorStop(0,'rgba(255,160,50,'+a+')');gr.addColorStop(1,'rgba(255,120,30,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.restore()}
function sparks(x,y,t,n=14,sp=120,hgt=320,sz=3){g.save();g.fillStyle='#ffd34a';for(let i=0;i<n;i++){const p=(t*.55+rnd(i+3))%1;g.globalAlpha=1-p;g.beginPath();g.arc(x+(rnd(i+50)-.5)*sp+Math.sin(t*3+i)*24*p,y-p*hgt,sz*(1-p*.5),0,7);g.fill()}g.restore()}
function fire(x,y,s,t,lit){spr(LOGS,x,y,260*s,140*s);if(lit>0)flame(x,y-58*s,210*s*lit,330*s*lit,t)}
function smoke(x,y,t,n,sp,a=.5,k=0){g.save();for(let i=0;i<n;i++){const p=(t*.35+rnd(i+k*9))%1;g.globalAlpha=a*(1-p)*Math.min(1,p*5);g.fillStyle='#8d8d93';g.beginPath();g.arc(x+(rnd(i+k*5+70)-.5)*sp+Math.sin(t*2+i)*14,y-p*240,14+p*30,0,7);g.fill()}g.restore()}
function mallow(x,y,toast){g.save();g.beginPath();g.roundRect(x-10,y-12,20,24,7);g.fillStyle=mix('#ffffff','#b8752e',toast);g.fill();g.strokeStyle='#555';g.lineWidth=1.8;g.stroke();g.restore()}

/* ---------- player ---------- */
const cap=document.getElementById('cap'),bar=document.getElementById('bar'),big=document.getElementById('big'),playB=document.getElementById('play'),voice=document.getElementById('voice');
bar.innerHTML=S.map((s,i)=>'<button aria-label="Scene '+(i+1)+'" data-i="'+i+'"><i></i></button>').join('');
const fills=[...bar.querySelectorAll('i')];
let si=0,st=0,playing=false,last=0,speaking=false,hold=0,ready=false;
const synth=window.speechSynthesis;
function narrate(){if(!synth)return;try{synth.cancel();speaking=false;if(!voice.checked)return;const u=new SpeechSynthesisUtterance(S[si].c.replace(/\.\.\./g,', '));u.rate=.92;u.pitch=1.05;const v=synth.getVoices().find(v=>/en[-_]US/i.test(v.lang));if(v)u.voice=v;u.onend=u.onerror=()=>{speaking=false};speaking=true;synth.speak(u)}catch(e){speaking=false}}
function go(i){si=clamp(i,0,S.length-1);st=0;hold=0;cap.textContent=S[si].c;if(playing)narrate()}
function setPlay(p){playing=p;playB.textContent=p?'Pause':(si===S.length-1&&st>=S[si].d?'Play again':'Play');big.hidden=p||!ready||st>0||si>0;if(!p&&synth)try{synth.cancel();speaking=false}catch(e){}}
function start(){if(si===S.length-1&&st>=S[si].d)go(0);setPlay(true);narrate()}
big.onclick=start;playB.onclick=()=>playing?setPlay(false):start();
document.getElementById('prev').onclick=()=>go(si-1);document.getElementById('next').onclick=()=>go(si+1);
document.getElementById('again').onclick=()=>{go(0);setPlay(true);narrate()};
voice.onchange=()=>{if(playing)narrate()};
bar.onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(si+1);if(e.key==='ArrowLeft')go(si-1);if(e.key===' '&&e.target===document.body){e.preventDefault();playing?setPlay(false):start()}});
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 if(ready){if(playing){const d=S[si].d;st+=dt;if(st>=d){if(speaking&&hold<8){hold+=dt}else if(si<S.length-1)go(si+1);else{st=d;setPlay(false)}}}
  g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);try{S[si].f(Math.min(st,S[si].d))}catch(e){console.error(e)}
  fills.forEach((f,i)=>f.style.width=(i<si?100:i>si?0:Math.min(100,st/S[si].d*100))+'%')}
 requestAnimationFrame(frame)}
const fontOk=document.fonts?Promise.race([document.fonts.load('30px "Patrick Hand"'),new Promise(r=>setTimeout(r,2000))]):Promise.resolve();
const imgOk=new Promise(r=>{if(pic.complete&&pic.naturalWidth)r();else{pic.onload=r;pic.onerror=r}});
Promise.all([fontOk,imgOk]).then(()=>{sprites();ready=true;big.textContent='▶ Play the story';big.hidden=false;go(0)});
requestAnimationFrame(frame);
}
</script>
</body>
</html>
